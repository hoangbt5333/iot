; ESP32 Node B (Security & Door) - PlatformIO Configuration

[esp32_base]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@3.2.1
build_flags =
    -Wall
    -Wextra

[env:sim]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D NODE_ENV_SIM=1

[env:real]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D NODE_ENV_REAL=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -Wall
    -Wextra
    -std=c++17
