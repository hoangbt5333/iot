; ESP32 Node A (Environment & Comfort) - PlatformIO Configuration

[esp32_base]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15

[env:sim]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D NODE_ENV_SIM=1

[env:real]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D NODE_ENV_REAL=1
lib_deps =
    ${esp32_base.lib_deps}
    claws/BH1750@1.3.0

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -Wall
    -Wextra
    -std=c++17
